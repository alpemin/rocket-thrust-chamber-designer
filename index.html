<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rocket Thrust Chamber Designer: 3D viewer</title>
<style>
:root{--bg:#f3f4f6;--panel:#ffffff;--ink:#14181f;--mute:#5b6472;--line:#d5d9e0;--accent:#c4410c}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--panel:#171b22;--ink:#e7eaf0;--mute:#98a1b0;--line:#2a313c;--accent:#ff8a4c}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:1.35rem;margin:0 0 4px;font-weight:650}
p.sub{margin:0 0 14px;color:var(--mute);font-size:.92rem;max-width:62ch;line-height:1.45}
#stage{position:relative;height:min(62vh,560px);min-height:320px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
canvas{display:block;width:100%;height:100%}
#hint{position:absolute;left:12px;bottom:10px;font-size:.78rem;color:var(--mute);pointer-events:none}
#legend{position:absolute;right:12px;bottom:10px;font-size:.78rem;color:var(--mute);display:flex;align-items:center;gap:6px;pointer-events:none}
#legend i{display:block;width:90px;height:8px;border-radius:4px;background:linear-gradient(90deg,#2f5bd8,#27b4c7,#f2d33a,#e8401c)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:14px}
.ctl{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.ctl label{display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:6px}
.ctl output{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:16px;margin-top:14px;font-size:.88rem}
.row label{display:flex;align-items:center;gap:6px;cursor:pointer}
.stats{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px 28px;font-size:.88rem;color:var(--mute)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
footer{margin-top:18px;font-size:.8rem;color:var(--mute);max-width:75ch;line-height:1.5}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>Rocket thrust chamber: 3D viewer</h1>

  <div id="stage">
    <div id="hint">Drag to rotate · scroll to zoom</div>
    <div id="legend">Cool <i></i> Hot</div>
  </div>

  <div class="grid">
    <div class="ctl"><label for="dt">Throat diameter <output id="o_dt"></output></label><input id="dt" type="range" min="30" max="160" step="1" value="88"></div>
    <div class="ctl"><label for="er">Expansion ratio <output id="o_er"></output></label><input id="er" type="range" min="4" max="40" step="0.5" value="12"></div>
    <div class="ctl"><label for="cr">Contraction ratio <output id="o_cr"></output></label><input id="cr" type="range" min="2" max="6" step="0.1" value="3"></div>
    <div class="ctl"><label for="ls">Characteristic length L* <output id="o_ls"></output></label><input id="ls" type="range" min="0.6" max="2" step="0.05" value="1"></div>
  </div>

  <div class="row">
    <label><input type="checkbox" id="cut" checked> Cutaway</label>
    <label><input type="checkbox" id="jacket"> Show Inconel jacket</label>
    <label><input type="checkbox" id="chan" checked> Cooling channels</label>
    <label><input type="checkbox" id="spin" checked> Auto-rotate</label>
  </div>

  <div class="stats">
    <span>Exit diameter <b id="s_de"></b></span>
    <span>Chamber diameter <b id="s_dc"></b></span>
    <span>Total length <b id="s_len"></b></span>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var stage=document.getElementById('stage');
  var renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  stage.insertBefore(renderer.domElement,stage.firstChild);
  var scene=new THREE.Scene();
  var camera=new THREE.PerspectiveCamera(35,1,1,10000);
  scene.add(new THREE.HemisphereLight(0xffffff,0x445566,0.75));
  var key=new THREE.DirectionalLight(0xffffff,0.9);key.position.set(300,500,400);scene.add(key);
  var rim=new THREE.DirectionalLight(0xffffff,0.35);rim.position.set(-400,-200,-300);scene.add(rim);

  var pivot=new THREE.Group();scene.add(pivot);
  var holder=new THREE.Group();holder.rotation.z=-Math.PI/2;pivot.add(holder);
  pivot.rotation.set(0.35,-0.7,0);
  var camDist=900;

  function $(id){return document.getElementById(id)}
  var D2R=Math.PI/180;

  // ---------- contour (x along axis, throat at x=0, injector at negative x) ----------
  function contour(Rt,eps,cr,Ls){
    var pts=[];
    var Rc=Rt*Math.sqrt(cr);
    var Lc=Ls*1000/cr;                 // cylinder length from L* = Vc/At (approx.)
    var a=30*D2R, R1=1.5*Rt, R2=0.382*Rt;
    // upstream throat arc
    var up=[];
    for(var i=0;i<=10;i++){var p=a*i/10;up.push([-R1*Math.sin(p),Rt+R1*(1-Math.cos(p))]);}
    var x1=up[10][0], r1=up[10][1];
    var xcone=x1-(Rc-r1)/Math.tan(a);
    var xstart=xcone-Lc;
    pts.push([xstart,Rc]);
    pts.push([xcone,Rc]);
    // cone (several points so colour interpolates)
    for(var k=1;k<=5;k++){pts.push([xcone+(x1-xcone)*k/6,Rc+(r1-Rc)*k/6]);}
    for(var i2=10;i2>=0;i2--)pts.push(up[i2]);
    // downstream throat arc
    var tn=32*D2R, te=8*D2R;
    var xn=R2*Math.sin(tn), rn=Rt+R2*(1-Math.cos(tn));
    for(var j=1;j<=10;j++){var q=tn*j/10;pts.push([R2*Math.sin(q),Rt+R2*(1-Math.cos(q))]);}
    // Rao parabola (quadratic Bezier)
    var xe=0.8*(Math.sqrt(eps)-1)*Rt/Math.tan(15*D2R), re=Math.sqrt(eps)*Rt;
    var m1=Math.tan(tn), m2=Math.tan(te);
    var qx=(re-rn+m1*xn-m2*xe)/(m1-m2), qy=rn+m1*(qx-xn);
    for(var ti=1;ti<=60;ti++){
      var t=ti/60,u=1-t;
      pts.push([u*u*xn+2*u*t*qx+t*t*xe, u*u*rn+2*u*t*qy+t*t*re]);
    }
    return {pts:pts,xstart:xstart,xend:xe,Rc:Rc,re:re};
  }

  // ---------- colour helpers ----------
  var stops=[[0.18,0.36,0.85],[0.15,0.71,0.78],[0.95,0.83,0.23],[0.91,0.25,0.11]];
  function ramp(v){
    if(!(v>=0))v=0;
    v=Math.max(0,Math.min(1,v))*3;var i=Math.min(2,Math.floor(v)),f=v-i;
    var a=stops[i],b=stops[i+1];
    return [a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f,a[2]+(b[2]-a[2])*f];
  }

  var meshes=[];
  function clearMeshes(){
    meshes.forEach(function(m){holder.remove(m);m.geometry.dispose();m.material.dispose();});
    meshes=[];
  }

  function lathe(pts,off,phiLen,mat,colorFn){
    var v=pts.map(function(p){return new THREE.Vector2(p[1]+off,p[0]);});
    var g=new THREE.LatheGeometry(v,160,0,phiLen);
    if(colorFn){
      var n=v.length,cnt=g.attributes.position.count,col=new Float32Array(cnt*3);
      for(var i=0;i<cnt;i++){var c=colorFn(pts[i%n]);col[i*3]=c[0];col[i*3+1]=c[1];col[i*3+2]=c[2];}
      g.setAttribute('color',new THREE.BufferAttribute(col,3));
    }
    var m=new THREE.Mesh(g,mat);holder.add(m);meshes.push(m);return m;
  }

  function channels(c,Rt,phiLen,N){
    var pts=c.pts,n=pts.length,pos=[],col=[],idx=[],step=2*Math.PI/N,hw=step*0.28;
    var base=0;
    for(var i=0;i<N;i++){
      var a=i*step;
      if(a+hw>phiLen+1e-6)continue;
      for(var j=0;j<n;j++){
        var r=pts[j][1]+3.3,x=pts[j][0];
        var s=(x-c.xend)/(c.xstart-c.xend);     // 0 at exit, 1 at injector
        s=Math.max(0,Math.min(1,s));
        var cc=ramp(0.05+0.9*Math.pow(s,0.8));
        [-hw,hw].forEach(function(d){
          pos.push(r*Math.sin(a+d),x,r*Math.cos(a+d));col.push(cc[0],cc[1],cc[2]);
        });
      }
      for(var k=0;k<n-1;k++){
        var A=base+2*k,B=A+1,C=A+2,D=A+3;
        idx.push(A,B,C,B,D,C);
      }
      base+=2*n;
    }
    var g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
    g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
    g.setIndex(idx);g.computeVertexNormals();
    var m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,side:THREE.DoubleSide,roughness:0.55,metalness:0.1}));
    holder.add(m);meshes.push(m);
  }

  function build(){
    var dt=+$('dt').value,eps=+$('er').value,cr=+$('cr').value,ls=+$('ls').value;
    $('o_dt').textContent=dt+' mm';$('o_er').textContent=eps.toFixed(1);
    $('o_cr').textContent=cr.toFixed(1);$('o_ls').textContent=ls.toFixed(2)+' m';
    var Rt=dt/2;
    var c=contour(Rt,eps,cr,ls);
    var cut=$('cut').checked,phi=cut?Math.PI*1.5:Math.PI*2;
    clearMeshes();

    // inner wall coloured by heat-flux proxy
    var inner=new THREE.MeshStandardMaterial({vertexColors:true,side:THREE.DoubleSide,roughness:0.6,metalness:0.1});
    lathe(c.pts,0,phi,inner,function(p){
      var q=Math.pow(Rt/p[1],1.8);var qm=Math.pow(Rt/c.Rc,1.8);
      return ramp(Math.pow(q,1.1));
    });
    // copper liner outer surface
    lathe(c.pts,3.0,phi,new THREE.MeshStandardMaterial({color:0xb86f45,side:THREE.DoubleSide,roughness:0.4,metalness:0.85}));
    if($('chan').checked)channels(c,Rt,phi,100);
    if($('jacket').checked){
      lathe(c.pts,6.5,phi,new THREE.MeshStandardMaterial({color:0x8c939e,side:THREE.DoubleSide,roughness:0.35,metalness:0.9}));
    }
    // injector flange
    var fl=new THREE.Mesh(new THREE.CylinderGeometry(c.Rc+22,c.Rc+22,12,96,1,false,0,phi),
      new THREE.MeshStandardMaterial({color:0x8c939e,roughness:0.35,metalness:0.9,side:THREE.DoubleSide}));
    fl.position.y=c.xstart-6;holder.add(fl);meshes.push(fl);

    // centre on bounding box
    var mid=(c.xstart+c.xend)/2;
    holder.children.forEach(function(m){m.position.y-=mid;});
    // (re-applied each build because clearMeshes removes old children)
    var len=c.xend-c.xstart+12;
    $('s_de').textContent=(c.re*2).toFixed(0)+' mm';
    $('s_dc').textContent=(c.Rc*2).toFixed(0)+' mm';
    $('s_len').textContent=len.toFixed(0)+' mm';
    camDist=Math.max(len,c.re*2)*2.1;
    zoom=Math.max(zoom,0)||1;
  }

  // ---------- interaction ----------
  var zoom=1,drag=false,lx=0,ly=0,auto=true;
  stage.addEventListener('pointerdown',function(e){drag=true;lx=e.clientX;ly=e.clientY;stage.setPointerCapture(e.pointerId);$('hint').style.opacity=0;});
  stage.addEventListener('pointerup',function(){drag=false;});
  stage.addEventListener('pointermove',function(e){
    if(!drag)return;
    pivot.rotation.y+=(e.clientX-lx)*0.01;
    pivot.rotation.x=Math.max(-1.4,Math.min(1.4,pivot.rotation.x+(e.clientY-ly)*0.01));
    lx=e.clientX;ly=e.clientY;
  });
  stage.addEventListener('wheel',function(e){e.preventDefault();zoom=Math.max(0.3,Math.min(3,zoom*(1+e.deltaY*0.001)));},{passive:false});
  var pinch=0;
  stage.addEventListener('touchmove',function(e){
    if(e.touches.length===2){
      var d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      if(pinch)zoom=Math.max(0.3,Math.min(3,zoom*pinch/d));pinch=d;
    }
  },{passive:true});
  stage.addEventListener('touchend',function(){pinch=0;});

  ['dt','er','cr','ls','cut','jacket','chan'].forEach(function(id){$(id).addEventListener('input',build);});
  $('spin').addEventListener('change',function(){auto=this.checked;});
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){auto=false;$('spin').checked=false;}

  function resize(){
    var w=stage.clientWidth,h=stage.clientHeight;
    renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
  }
  window.addEventListener('resize',resize);

  function loop(){
    if(auto&&!drag)pivot.rotation.y+=0.004;
    camera.position.set(0,0,camDist*zoom);camera.lookAt(0,0,0);
    renderer.render(scene,camera);
    requestAnimationFrame(loop);
  }
  resize();build();loop();
})();
</script>
</body>
</html>
